[package]
name = "chainshield"
version = "1.0.0"
edition = "2021"
authors = ["ChainShield Team <support@chainshield.io>"]
description = "Official Rust SDK for ChainShield Risk Assessment API"
license = "MIT"
repository = "https://github.com/chainshield/chainshield-rust"
homepage = "https://chainshield.io"
documentation = "https://docs.chainshield.io"
keywords = ["blockchain", "crypto", "risk", "aml", "sanctions"]
categories = ["api-bindings", "cryptography"]

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"
