[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chainshield"
version = "1.0.0"
description = "Official Python SDK for ChainShield Risk Assessment API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ChainShield Team", email = "support@chainshield.io"}
]
keywords = ["blockchain", "crypto", "risk", "assessment", "aml", "sanctions", "fraud"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://chainshield.io"
Documentation = "https://docs.chainshield.io"
Repository = "https://github.com/chainshield/chainshield-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["chainshield*"]
