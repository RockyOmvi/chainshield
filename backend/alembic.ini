# Alembic Configuration
# Database migration tool for ChainShield

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend date to migration file name
prepend_sys_path = .

# Timezone for migration timestamps
timezone = UTC

# Max length for generated revision IDs
truncate_slug_length = 40

# Set to true to require revision of migration scripts
revision_environment = false

# Set to 'true' to run the environment during 'revision'  
sourceless = false

# Version path separator
version_path_separator = os

# Output encoding for revision files
output_encoding = utf-8

[post_write_hooks]
# Hooks to run after generating new revision

# Format with Black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
